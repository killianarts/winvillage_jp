<header class="sm:flex sm:space-x-3">
  {% comment %}
    -mt-[0.16ch] to remove whitespace at top
  {% endcomment %}
  <span class="-mt-[0.16ch] text-orange-500 text-3xl sm:text-7xl font-industrial tracking-tightest text-center sm:text-left block">{{ number }}</span>
  <div class="text-center sm:text-left grid">
    <p class="relative w-fit uppercase font-antique text-sm tracking-widest before:content-['+'] before:absolute before:left-0 before:-top-[0.2ch]  after:content-['+'] after:absolute after:right-0 after:-top-[0.2ch] px-[1.5ch]">
      {#      <span class="align-text-bottom">+</span>#}
      {{ subheader }}
      {#      <span class="align-text-bottom">+</span></p>#}
    <h2 class="font-bold text-2xl sm:text-3xl text-balance">{{ header }}</h2>
  </div>
</header>
