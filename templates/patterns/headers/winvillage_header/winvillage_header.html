<header class="sm:flex sm:space-x-3">
  {% comment %}
    -mt-[0.16ch] to remove whitespace at top
  {% endcomment %}
  <span class="-mt-[0.16ch] text-orange-500 text-3xl sm:text-7xl font-display text-center sm:text-left block">{{ number }}</span>
  <div class="text-center sm:text-left grid">
    <p class="uppercase font-display text-sm tracking-widest">{{ subheader }}</p>
    <h2 class="font-bold text-2xl sm:text-3xl text-balance">{{ header }}</h2>
  </div>
</header>
