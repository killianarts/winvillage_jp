<c-vars id />
{% load static %}
<div class="image-slider-container"
     {% comment %}
     _="on wheel(deltaX)
     if deltaX != 0
     halt the event
     end
     increment [@data-scroll] of #images by `${deltaX * 10}px`
     set *transform of #images to `translateX(${#images@data-scroll}px)`
     end"
     {% endcomment %}
>
    <div class="mx-auto z-40 overflow-x-hidden relative flex justify-center items-center h-[333px] sm:h-[555px] xl:h-[666px] px-10">

        {% comment %}This is for allowing the images to overflow without clipping or scrolling, and to allow the corner borders to be visible{% endcomment %}
        <div class="relative max-w-[300px] sm:max-w-[500px] lg:max-w-[700px] h-[200px] sm:h-[333px] mx-auto">
            <button class="arrow-right absolute top-1/2 -translate-y-1/2 -right-5 z-30"
                    _="on load get the next .image-slider then set :image_slider to it end
                           on click
                           set :data_selected to <[data-selected]/> in :image_slider
                           set :not_selected to the first <[data-selected='false']/> in :image_slider
                           if the @data-image-current of :image_slider < (the length of :data_selected - 1)
                           get the *computed-width of :not_selected then set :scroll_distance to it
                           get the *computed-row-gap of :image_slider then increment :scroll_distance by it
                           get :data_selected[`${@data-image-current of :image_slider}`] then set its @data-selected to false
                           increment @data-image-current of :image_slider
                           get :data_selected[`${@data-image-current of :image_slider}`] then set its @data-selected to true
                           decrement @data-scroll of :image_slider by :scroll_distance
                           transition the :image_slider's *transform to `translateX(${@data-scroll of :image_slider}px)` over 500ms
                           {% comment %}
                           {% endcomment %}
                           end">
                <img src="{% static 'core/img/pointing-hand-right.svg' %}" alt="" />
            </button>
            <button class="arrow-left absolute top-1/2 -translate-y-1/2 -left-5 z-30"
                    _="on load get the next .image-slider then set :image_slider to it end
                           on click
                           set :data_selected to <[data-selected]/> in :image_slider
                           set :not_selected to the first <[data-selected='false']/> in :image_slider
                           if the @data-image-current of :image_slider > 0
                           get the *computed-width of :not_selected then set :scroll_distance to it
                           get the *computed-row-gap of :image_slider then increment :scroll_distance by it
                           get :data_selected[`${@data-image-current of :image_slider}`] then set its @data-selected to false
                           decrement @data-image-current of :image_slider
                           get :data_selected[`${@data-image-current of :image_slider}`] then set its @data-selected to true
                           increment @data-scroll of :image_slider by :scroll_distance
                           transition the :image_slider's *transform to `translateX(${@data-scroll of :image_slider}px)` over 500ms
                           end">
                <img src="{% static 'core/img/pointing-hand-left.svg' %}" alt="" />
            </button>

            <div data-scroll="0" data-image-current="0"
                 _="on load
                              set :data_selected to <[data-selected]/> in me
                              get :data_selected[`${my @data-image-current}`] set :current_image to it then set its @data-selected to true
                              end

                              {% comment %}
                              on wheel from .image-slider
                              if my @data-scroll < -700
                              set my @data-scroll to 0
                              get <[data-selected='true']/> then set its @data-selected to false
                              increment my @data-image-current
                              get :data_selected[`${my @data-image-current}`] then set its @data-selected to true end
                              if my @data-scroll > 700
                              set my @data-scroll to 0
                              get <[data-selected='true']/> then set its @data-selected to false
                              decrement my @data-image-current
                              get :data_selected[`${my @data-image-current}`] then set its @data-selected to true end
                              {% endcomment %}
                              "
                 class="image-slider flex w-max h-[200px] sm:h-[333px] items-center gap-10">
                {% for image in images %}
                    <div class="image-wrapper cursor-pointer">
                        <img src="{{ image }}" data-image-counter="{{ forloop.counter0 }}"
                             class="data-[selected=true]:w-[300px] data-[selected=false]:w-[100px] transition-all duration-500 ease-in-out
                                  sm:data-[selected=true]:w-[500px] sm:data-[selected=false]:w-[200px]
                                  lg:data-[selected=true]:w-[700px] lg:data-[selected=false]:w-[300px]" data-selected="false" alt="" />
                    </div>
                {% endfor %}
            </div>
        </div>

    </div>
    {{ slot }}
</div>
