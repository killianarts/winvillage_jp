<c-vars month weekdays />
<div {{ attrs }}>
    <h2 class="text-center text-sm font-semibold text-stone-900">{{ month.date|date:"Y-m" }}</h2>
    <div class="calendar-days mt-10 grid grid-cols-7 text-center text-xs leading-6 text-stone-500">
        {% for day in weekdays %}
            <span class="h-8 w-8 flex items-center justify-center mx-auto">{{ day }}</span>
        {% endfor %}
    </div>
    <div class="mt-2 grid grid-cols-7 text-sm">
        <!--
             Always include: "mx-auto flex h-8 w-8 items-center justify-center rounded-full"
             Is selected, include: "text-white"
             Is not selected and is today, include: "text-orange-600"
             Is not selected and is not today and is current month, include: "text-stone-900"
             Is not selected and is not today and is not current month, include: "text-stone-400"
             Is selected and is today, include: "bg-orange-600"
             Is selected and is not today, include: "bg-stone-900"
             Is not selected, include: "hover:bg-stone-200"
             Is selected or is today, include: "font-semibold"
        -->
        {% for dt, is_occurrence in month.occurrences.items %}
            {% if is_occurrence %}
                <c-calendar-cell-button :datetime=dt name="select_date" class="text-stone-900 bg-green-500 hover:bg-stone-400" />
            {% elif dt.month != month.date.month %}
                <div></div>
                {# show nothing #}
            {% else %}
                <c-calendar-cell-button :datetime=dt name="select_date" class="text-stone-900 hover:bg-stone-400" />
            {% endif %}
        {% endfor %}
    </div>
</div>
