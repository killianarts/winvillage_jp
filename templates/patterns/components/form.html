<c-vars method="post" dj-block hx-swap="outerHTML" url="." />
<div class="form-dj-block-designator" hx-vals='{"use_block": "{{ dj_block }}"}'>
  <form action="{{ url }}" method="{{ method }}" hx-{{ method }}="{{ url }}" hx-swap="{{ hx_swap }}" {{ attrs }}>
    {% csrf_token %}
    {% if dj_block %}
      {{ slot }}
    {% else %}
      {{ slot }}
    {% endif %}
  </form>
</div>
