<c-vars datetime url />
<c-form hx-target="#reservation-form-wrapper" block="date-select">
  {{ slot }}
  <button {{ attrs }}
          class="mx-auto flex relative z-10 h-8 w-8 items-center justify-center tabular-nums {{ class }}">
    <time datetime="{{ datetime }}">{{ datetime.day }}</time>
  </button>
</form>
