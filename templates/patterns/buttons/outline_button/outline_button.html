{% var class %}
{% var variant=variant|default:"normal" %}
<button {% attrs hx-get hx-swap hx-target hx-trigger hx-vals hx-ext hx-push-url name type value id data-script formmethod %}
        class="px-5 py-2.5 text-sm font-semibold drop-shadow-hard-45-xs rounded-md ring-2
        transition-all duration-250 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2
         text-stone-900 hover:translate-x-1 hover:translate-y-1 hover:drop-shadow-none
        hover:ring-transparent 
        {{ class }}
        {{ variant|match:"normal: bg-stone-100 ring-stone-900 hover:bg-orange-500 hover:text-orange-100 focus-visible:outline-orange-700" }}
        {{ variant|match:"danger: bg-red-500 ring-red-900 hover:bg-red-900 hover:text-red-100 focus-visible:outline-red-700" }}
">
  {{ children }}
</button>
