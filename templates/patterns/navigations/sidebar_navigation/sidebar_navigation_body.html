<!-- Tailwind UI Static sidebar for desktop -->
{% load static i18n %}
<div class="hidden lg:fixed lg:inset-y-0 lg:z-50 lg:flex lg:w-72 lg:flex-col">
  <!-- Sidebar component, swap this element with another sidebar if you like -->
  <div class="flex grow flex-col gap-y-5 overflow-y-auto bg-stone-900 px-6">
    <div class="flex h-16 shrink-0 items-center">
      <a href="{% url 'winadmin:index' %}"><img class="h-16"
                                                src="{% static 'core/img/dark_logo.svg' %}"
                                                alt="Winvillage logo"></a>
    </div>
    <nav class="flex flex-1 flex-col">
      <ul role="list" class="flex flex-1 flex-col gap-y-7">
        <li>
          {{ children }}
        </li>
        {% if user.is_authenticated %}
          <li class="-mx-6 mt-auto">
            <a href="{% url 'users:logout' %}"
               class="flex justify-end gap-x-4 px-6 py-3 text-sm font-semibold leading-6 text-white hover:bg-stone-800">
              <span aria-hidden="true">{% translate 'Log Out' %} {{ user }}</span>
            </a>
          </li>
        {% endif %}
      </ul>
    </nav>
  </div>
</div>
