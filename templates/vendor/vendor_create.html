{% extends 'winadmin/index.html' %}
{% load static i18n %}
{% block extra_styles %}
{% endblock %}
{% block subtitle %}
    {% blocktrans %}Create Vendor{% endblocktrans %}
{% endblock %}
{% block page_header %}
    <c-admin-page-header header="{% translate 'Procurements Management' %}"
                         subheader="{% trans 'Create Vendor' %}"/>
{% endblock %}
{% block content %}
    <c-form id="vendor-create-form" class="p-2" hx-target="#content-wrapper" block="content">
        {{ form }}
        <c-button name="create-vendor" value="create-vendor">{% trans "Submit" %}</c-button>
    </c-form>
{% endblock %}
