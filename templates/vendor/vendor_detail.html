{% extends 'winadmin/index.html' %}
{% load static i18n %}
{% block subtitle %}
  {% blocktrans %}Edit Vendor{% endblocktrans %}
{% endblock %}
{% block page_header %}
  <c-admin-page-header header="{% translate 'Procurements Management' %}"
                       subheader="{% trans 'Edit Vendor' %}"/>
{% endblock %}
{% block content %}
  <c-form class="p-2" hx-target="#content-wrapper" block="content">
    {{ form }}
    <c-button name="edit" data-action="edit">{% trans "Edit" %}</c-button>
    <c-button name="delete" data-action="delete">{% trans "Delete" %}</c-button>
  </c-form>
{% endblock %}
