{% extends 'winadmin/index.html' %}
{% load i18n %}
{% block content %}
  <div id="content-wrapper">
    <h1 class="text-3xl">{% translate 'Create Pricing Tier' %}</h1>
    <c-form class="grid gap-5" method="dialog" novalidate
            hx-target="#content-wrapper"
            hx-swap="morph:outerHTML"
            block="content">
      {{ form }}
      <c-button type="dialog">
        {% trans "Submit" %}
      </c-button>
    </c-form>
  </div>
{% endblock %}
