{% load i18n %}
{% load widget_tweaks %}

<div id="reservation-form-wrapper" class="mx-auto max-w-5xl px-5">
  <h2 class="text-center text-xl sm:text-3xl text-green-950 pb-2 mb-2 border-b-2 border-neutral-100">
    {% translate 'Choose Options' %}</h2>
  <form action="{% url 'reservations:confirm_reservation' %}" method="post"
        hx-post="{% url 'reservations:confirm_reservation' %}"
        hx-target="#reservation-form-wrapper"
        hx-swap="outerHTML"
        class="space-y-2">
    {#        <h2 class="text-xl text-center">Tailwind Calendar Component</h2>#}
    <fieldset>
      <legend class="sr-only">{% translate 'Option Types' %}</legend>
      <div class="space-y-2 grid grid-cols-1">
        {% for field in form %}
          <label class="text-xl mb-2 grid grid-cols-2 items-center gap-x-2" for="{{ field.name }}">
            {% if field.label == "Grill" %}
              {{ field.label }} {% translate '($50)' %}
            {% endif %}
            {% if field.label == "Food" %}
              {{ field.label }} {% translate '($100)' %}
            {% endif %}
            {% render_field field class="justify-self-end" %}
          </label>
        {% endfor %}
      </div>
    </fieldset>

    <button type="submit"
            hx-post="{% url 'reservations:step-3' %}"
            hx-target="#reservation-form-wrapper"
            hx-swap="outerHTML"
            class="col-span-2 bg-green-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-green-500
                focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-600">
      {% translate 'Back' %}
    </button>
    <button type="submit"
            class="col-span-2 bg-green-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-green-500
                focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-600">
      {% translate 'Next' %}
    </button>
