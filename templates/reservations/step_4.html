{% load i18n %}
{% load widget_tweaks %}

<div id="reservation-form-wrapper" class="mx-auto max-w-5xl px-5">
  <h2 class="text-center text-xl sm:text-3xl text-green-950 pb-2 mb-2 border-b-2 border-neutral-100">
    {% translate 'Contact Information' %}</h2>
  <form class="space-y-2">
    <fieldset>
      <legend class="sr-only">{% translate 'Contact Information' %}</legend>
      <div class="grid grid-cols-1">
        {{ form.non_field_errors }}
        {% for field in form %}
          <label class="text-xl mb-2 grid grid-cols-2 items-center gap-x-2" for="{{ field.id_for_label }}">
            {{ field.label }}
            {% render_field field class="justify-self-end" %}
            {% if field.errors %}
              {% for error in field.errors %}
                <div class="flex gap-2">
                  {#                    <img class="inline-block" src="{% static 'core/warning_icon.svg' %}">#}
                  <p class="text-red-500 text-lg font-body font-thin">{{ error|escape }}</p>
                </div>
              {% endfor %}
            {% endif %}
          </label>
        {% endfor %}
      </div>
    </fieldset>

    <button name="back"
            type="submit"
            hx-get="{% url 'reservations:step-3' %}"
            hx-target="#reservation-form-wrapper"
            hx-swap="outerHTML"
            class="col-span-2 bg-green-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-green-500
                focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-600">
      {% translate 'Back' %}
    </button>
    <button name="submit"
            type="submit"
            hx-post="{% url 'reservations:step-4' %}"
            hx-target="#reservation-form-wrapper"
            hx-swap="outerHTML"
            class="col-span-2 bg-green-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-green-500
                focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-600">
      {% translate 'Next' %}
    </button>
  </form>
</div>
