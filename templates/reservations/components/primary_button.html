{% load i18n %}
<button name="{{ name }}"
        type="{{ type }}"
        hx-get="{{ hx_get }}"
        class="col-span-2 bg-orange-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm
               hover:bg-orange-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2
               focus-visible:outline-orange-600">
  {% blocktranslate %}
    {{ text }}
  {% endblocktranslate %}
</button>
