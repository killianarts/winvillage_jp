[tool.poetry]
name = "winvillage"
version = "0.1.0"
description = ""
authors = ["Micah Killian <micah@killianarts.online>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
django-environ = "^0.10.0"
django-model-utils = "^4.3.1"
django-htmx = "^1.16.0"
django-render-block = "^0.9.2"
django-widget-tweaks = "^1.4.12"
gunicorn = "^20.1.0"
psycopg = { version = "^3.1.12", extras = ["binary"] }
pillow = "^10.0.0"
whitenoise = { extras = ["brotli"], version = "^6.5.0" }
django-rosetta = "^0.9.9"
django-parler = "^2.3"
django-responsive-images = "^1.3.0"
django-countries = "^7.5.1"
squareup = "^28.0.1.20230608"
django-extensions = "^3.2.3"
flake8 = "^6.0.0"
factory-boy = "^3.2.1"
black = "^23.7.0"
django-browser-reload = "^1.11.0"
argon2-cffi = "^21.3.0"
django = "^4.2.4"
ruff = "^0.0.290"
django-tailwind-cli = { extras = ["django-extensions"], version = "^2.4.3" }
pyopenssl = "^23.2.0"
sendgrid = "^6.10.0"
django-phonenumber-field = { extras = ["phonenumberslite"], version = "^7.2.0" }
celery = { extras = ["redis"], version = "^5.3.4" }
slippers = "^0.6.2"
babel = "^2.13.1"
honcho = "^1.1.0"
pendulum = "^3.0.0"

[tool.poetry.group.dev.dependencies]
autopep8 = "^2.0.2"
django-pattern-library = "^1.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Enable the pycodestyle (`E`) and Pyflakes (`F`) rules by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
# DTZ for datetime errors
# A for shadowed Python builtins
select = ["E", "F", "DTZ", "A"]
# Avoid enforcing line-length violations (`E501`)
ignore = ["E501"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations"
]