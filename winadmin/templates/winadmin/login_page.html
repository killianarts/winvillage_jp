{% extends 'winadmin/base.html' %}
{% load i18n %}
{% block content %}
  <div id="login-form-wrapper" class="mx-auto max-w-xl px-5">
    <h2 class="mb-2 border-b-2 border-neutral-100 pb-2 text-center text-xl text-orange-950 sm:text-3xl">
      {% translate 'Winvillage Admin Login' %}</h2>
    <c-form hx-target="#login-form-wrapper">
      {{ form }}
      <c-button name="submit" type="submit">{% trans 'Login' %}</c-outline-button>
    </c-form>
  </div>
{% endblock %}
