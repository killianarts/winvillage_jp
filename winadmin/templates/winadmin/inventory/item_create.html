{% extends 'winadmin/index.html' %}
{% load i18n %}
{% block subtitle %}
  {% blocktrans %}Create Item{% endblocktrans %}
{% endblock %}
{% block content %}
  <div id="content-wrapper">
  <h1 class="text-3xl">{% translate 'Add Inventory Item' %}</h1>
  <form class="grid max-w-xl" action="."
        hx-post="."
        hx-target="#content-wrapper"
        hx-swap="morph:outerHTML"
        hx-vals='{"use_block": "content"}'>
    {{ form }}
    {% #button name="submit" type="submit" %}
      {% trans "Submit" %}
    {% /button %}
  </form>
  </div>
{% endblock %}
