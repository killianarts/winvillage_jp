{% extends 'winadmin/index.html' %}
{% load i18n %}
{% block subtitle %}
  {% blocktrans %}Create Item{% endblocktrans %}
{% endblock %}
{% block content %}
  <div id="content-wrapper">
  <h1 class="text-3xl">{% translate 'Add Inventory Item' %}</h1>
  <c-form class="grid max-w-xl" enctype="multipart/form-data"
        hx-target="#content-wrapper"
       block="content">
    {{ form }}
    <c-button>{% trans "Submit" %}</c-button>
  </c-form>
  </div>
{% endblock %}
