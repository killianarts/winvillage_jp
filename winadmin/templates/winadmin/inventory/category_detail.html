{% extends 'winadmin/index.html' %}
{% load i18n %}
{% block subtitle %}
  {% blocktrans %}Edit Category{% endblocktrans %}
{% endblock %}
{% block content %}
  <h1 class="mb-5 text-3xl">{% translate 'Category Edit View' %}</h1>
  {% block form %}
    <form id="category-form"
          action="." method="post"
          hx-post="."
          hx-target="this"
          hx-swap="outerHTML"
          hx-vals='{"use_block": "form"}'
          class="grid max-w-xl space-y-2" novalidate>
      {{ form }}
      <c-button>
        {% trans "Submit" %}
      </c-button>
    </form>
  {% endblock %}
{% endblock %}
