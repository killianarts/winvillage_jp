{% extends 'winadmin/index.html' %}
{% load i18n %}
{% block subtitle %}

{% endblock %}
{% block page_header %}

                       subheader="{% trans 'Category Edit View' %}"/>
{% endblock %}
{% block content %}

    </c-form>
{% endblock %}
