{% extends 'winadmin/index.html' %}
{% load widget_tweaks i18n %}
{% block subtitle %}
  {% blocktrans %}Create Category{% endblocktrans %}
{% endblock %}
{% block content %}
  <div id="content-wrapper">
    <h1 class="mb-5 text-3xl">{% translate 'Category Create View' %}</h1>
    <c-form class="grid max-w-xl space-y-2"
            hx-target="#content-wrapper"
            block="content">
      {{ form }}
      <c-button>{% trans "Submit" %}</c-button>
    </c-form>
  </div>
{% endblock %}
