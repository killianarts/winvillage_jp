{% extends 'winadmin/index.html' %}
{% load i18n %}
{% block subtitle %}
  {% translate 'Edit Inventory Item' %}
{% endblock %}
{% block page_header %}
  <c-admin-page-header header="{% translate 'Inventory Management' %}"
                       subheader="{% trans 'Edit Inventory Item' %}"/>
{% endblock %}
{% block content %}
  <c-form enctype="multipart/form-data"
          class="grid max-w-xl">
    {{ form }}
    <c-crud-button-container>
      <c-button name="edit">{% trans "Submit" %}</c-button>
      <c-button name="delete" type="button" data-action="delete">{% trans "Delete" %}</c-button>
    </c-crud-button-container>
  </c-form>
{% endblock %}
