{% extends 'winadmin/index.html' %}
{% load i18n %}
{% block title %}
    {% blocktrans %}Create a ticket{% endblocktrans %}
{% endblock %}

{% block content %}
    <div id="content-wrapper" class="space-y-5">
        <h1 class="text-3xl">{% translate 'Create Ticket' %}</h1>
        <c-form hx-target="#dashboard-content" block="content" class="space-y-5">
            {{ form }}
            <c-button>
                {% trans 'Create Ticket' %}
            </c-button>
        </c-form>
    </div>
{% endblock %}

{% block created %}
    <div hx-get="{% url 'winadmin:customer_list' %}"
         hx-replace-url="{% url 'winadmin:customer_list' %}"
         hx-target="this"
         hx-trigger="load"
         hx-swap="outerHTML"></div>
{% endblock %}
