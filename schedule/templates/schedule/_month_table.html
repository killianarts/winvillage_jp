{% load scheduletags %}
<table class="mx-auto">
{% if day_names %}
<thead>
  <th>&nbsp;</th>
  {% for day_name in day_names %}
    <th class="p-3 text-center">{{ day_name|slice:"0:1" }}</th>
  {% endfor %}
</thead>
{% endif %}
<tbody>
  {% for week in month.get_weeks %}
      <tr class="text-center">
      <td class="py-2">
          <a href="{% url "week_calendar" calendar.slug %}{% querystring_for_date week.start 3 %}">
              {{week.start|date:"W"}}
          </a>
      </td>
      {% for day in week.get_days %}
    {% day_cell calendar day month size %}
      {% endfor %}
      </tr>
  {% endfor %}
</tbody>
</table>
